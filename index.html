*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f4f8ff}
a{text-decoration:none;color:inherit}
button{font-family:inherit}

/* HEADER */
header{display:flex;justify-content:space-between;align-items:center;padding:20px 60px;background:#d7e9ff;position:sticky;top:0;z-index:1000;gap:15px}
.logo img{width:150px;cursor:pointer}
nav{display:flex;align-items:center}
nav a{margin:0 15px;color:black;font-weight:500;transition:.3s;cursor:pointer}
nav a:hover{color:#4a90e2}
.search{display:flex;gap:8px}
.search input{padding:8px;border:none;border-radius:5px;outline:none;width:200px}
.search button{padding:8px 14px;border:none;background:white;color:#4a90e2;font-weight:bold;cursor:pointer;border-radius:5px}
.cart-icon{position:relative;cursor:pointer}
.cart-img{width:28px;height:28px;transition:.3s}
.cart-img:hover{transform:scale(1.1)}
#cartCount{position:absolute;top:-8px;right:-10px;background:red;color:white;font-size:12px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:bold}

/* SLIDER */
.slider{position:relative;max-width:900px;margin:20px auto;overflow:hidden;border-radius:10px}
.slides{display:flex;width:300%;transition:.5s}
.slides img{width:33.3333%;height:auto}
.btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:white;border:none;padding:10px 15px;cursor:pointer;font-size:20px}
.next{right:10px}.prev{left:10px}

/* HOME */
.featured{padding:60px;text-align:center}
.featured h2{font-size:35px;margin-bottom:40px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:30px}
.product{background:white;padding:15px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:.3s;cursor:pointer}
.product:hover{transform:translateY(-5px);box-shadow:0 6px 20px rgba(74,144,226,.2)}
.product img{width:100%;height:180px;object-fit:cover;border-radius:10px}
.product h4{margin:10px 0 5px}
.product p{font-weight:bold;color:#555}
.collections{padding:70px;text-align:center;background:#fff}
.collection-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;margin-top:40px}
.collection-card{background:#eaf3ff;padding:40px 20px;border-radius:15px;transition:.3s;cursor:pointer}
.collection-card:hover{transform:translateY(-5px);background:#d7e9ff}
.collection-card h3{margin-bottom:10px}
.sale{background:#d7e9ff;padding:60px;text-align:center}
.offer-box{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap}
.offer-box img{width:180px;border-radius:15px}
.offer-text h2{font-size:32px;margin-bottom:10px}
.offer-text p{font-size:18px;margin-bottom:15px}
.pill{padding:10px 25px;background:#4a90e2;border:none;color:white;border-radius:25px;cursor:pointer;font-size:16px}
.pill:hover{background:#2f6fb7}
.about-section{padding:80px 60px 20px;background:#fff}
.about-container{display:flex;align-items:center;justify-content:space-between;gap:50px;flex-wrap:wrap}
.about-text{flex:1;min-width:280px}
.about-text h2{font-size:40px;margin-bottom:20px}
.about-text p{font-size:17px;line-height:1.8;color:#555;margin-bottom:25px}
.video-box{flex:1;min-width:280px}
.video-box video{width:100%;border-radius:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:30px;padding:60px 0}
.card{background:white;padding:20px;border-radius:12px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:.3s}
.card:hover{transform:translateY(-5px)}
.card img{width:100%;border-radius:10px;margin-bottom:15px}
.contact-section{background:#eaf3ff}
.contact-container{display:flex;justify-content:space-between;align-items:flex-start;gap:50px;padding:60px;flex-wrap:wrap}
.contact-left,.contact-right{flex:1;min-width:260px}
.contact-left h2{font-size:50px;margin-bottom:20px}
.contact-left p{font-size:20px;margin-bottom:15px;line-height:1.6}
.contact-left h3,.contact-right h3{font-size:35px;margin:25px 0 20px}
.contact-right{text-align:center}
.icon-img{width:18px;height:18px;margin-right:8px;vertical-align:middle}
.social-icons{display:flex;justify-content:center;gap:20px;margin-bottom:40px}
.social-icons img{width:60px;height:60px;background:white;padding:10px;border-radius:50%;box-shadow:0 5px 15px rgba(0,0,0,.1);transition:.3s}
.social-icons img:hover{transform:translateY(-6px)}
.payment-small h4{font-size:25px;margin-bottom:20px}
.payment-icons{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}
.payment-icons img{width:55px;height:55px;object-fit:contain;background:white;padding:8px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.payment-card-small p{font-size:12px;margin-top:6px}

/* COLLECTION PAGES */
.hero{height:300px;background:#bcd9ff center/cover;display:flex;justify-content:center;align-items:center}
.hero h1{background:rgba(255,255,255,.7);padding:20px 40px;border-radius:10px;font-size:44px;text-align:center}
.products{padding:70px 8%}
.products h2{text-align:center;margin-bottom:50px;font-size:40px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:30px}
.ccard{background:white;border-radius:15px;overflow:hidden;transition:.3s;box-shadow:0 5px 15px rgba(0,0,0,.1)}
.ccard:hover{transform:translateY(-8px);box-shadow:0 6px 20px rgba(74,144,226,.2)}
.ccard img{width:100%;height:260px;object-fit:cover}
.ccard-content{padding:20px;text-align:center}
.cprice{color:#4a90e2;font-size:22px;font-weight:bold;margin:10px 0}
.blue-btn{background:#4a90e2;color:white;border:none;padding:10px 25px;border-radius:30px;cursor:pointer;font-size:16px}
.blue-btn:hover{background:#2f6fb7}

/* PRODUCT PAGE */

.left-side{flex:1;min-width:280px}
.main-image{border-radius:10px;overflow:hidden}
.main-image img{width:100%;max-width:420px;transition:.3s;display:block}
.main-image:hover img{transform:scale(1.12)}
.thumbnail-container{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.thumbnail{width:70px;height:70px;border:2px solid #ddd;border-radius:8px;overflow:hidden;cursor:pointer;transition:.3s}
.thumbnail img{width:100%;height:100%;object-fit:cover}
.thumbnail:hover,.thumbnail.active{border-color:orange;transform:scale(1.05)}
.product-details{flex:1.2;min-width:280px}
.product-title{font-size:30px;margin-bottom:15px}
.description{font-size:13px;font-weight:400;margin-bottom:15px;line-height:1.6}
.rating{color:gold;margin-bottom:15px}
.price{font-size:32px;color:#f57224;margin-bottom:10px}
.price p{font-size:12px;color:black}
.old-price{text-decoration:line-through;color:gray;margin-bottom:20px}
.features{margin-bottom:20px;list-style:none}
.features li{margin-bottom:10px}
.buttons{display:flex;gap:20px;flex-wrap:wrap}
.buy-btn,.cart-btn{padding:15px 35px;border:none;font-size:18px;border-radius:5px;cursor:pointer;color:white}
.buy-btn{background:#2abbe8}.cart-btn{background:#f57224}
.buy-btn:hover{background:#169ac2}.cart-btn:hover{background:#d95c14}

.cart-container{display:flex;gap:25px;flex-wrap:wrap}
.cart-items{flex:2;min-width:300px;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.cart-title,.cart-summary h2{margin-bottom:25px;color:#192bc2}

.product-info img{width:100px;height:100px;object-fit:cover;border-radius:10px}
.product-info h3{margin-bottom:8px}
.product-price{color:#192bc2;font-weight:bold;font-size:20px}
.quantity{display:flex;align-items:center;gap:10px}

.remove-btn{background:none;border:none;color:red;font-size:22px;cursor:pointer}

.delivery-info h2{margin-bottom:30px}
.form-row{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.form-group{flex:1;min-width:200px}
label{display:block;margin-bottom:8px;font-weight:500}
.delivery-info input,.delivery-info select,.delivery-info textarea,.promo input{width:100%;padding:14px;border:1px solid #ddd;border-radius:5px;font-size:15px}
textarea{resize:none;height:100px}
.label-buttons{display:flex;gap:20px;margin:15px 0 30px}
.label-btn{padding:15px 35px;border:2px solid #ddd;background:white;border-radius:8px;cursor:pointer}
.label-btn:hover,.label-btn.sel{border-color:#ff6600}
.payment-method h3{margin-bottom:15px}

.payment-card:hover,.payment-card.sel{border-color:#ff6600}
.payment-card img{width:45px;height:45px;object-fit:contain}
.payment-card p{font-size:12px;margin-top:8px}
.order-summary{flex:1;min-width:260px;background:white;padding:30px;border-radius:10px;height:fit-content}
.order-summary h2{margin-bottom:25px}
.promo{display:flex;margin-bottom:30px}
.promo input{border-radius:5px 0 0 5px}
.apply-btn{background:#2ba6df;color:white;border:none;padding:0 20px;border-radius:0 5px 5px 0;cursor:pointer}
.summary-item{display:flex;justify-content:space-between;margin:15px 0;gap:10px}
.summary-item.total{font-size:26px;color:#2ba6df}
.pay-btn{width:100%;background:#2ba6df;color:white;border:none;padding:16px;border-radius:5px;font-size:18px;cursor:pointer;margin-top:20px}
.pay-btn:hover{background:#1c8fc4}
.err{color:#d33;font-size:13px;margin-top:10px;min-height:18px}

footer{background:#d7e9ff;text-align:center;padding:20px;margin-top:40px}

/* SIGNUP */
.signup-popup{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;justify-content:center;align-items:center;z-index:2000}
.signup-card{width:380px;max-width:92%;background:white;padding:40px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.signup-card h2{margin-bottom:25px;font-size:34px}
.signup-card input{width:100%;padding:14px;margin-bottom:18px;border:1px solid #ccc;border-radius:8px;font-size:15px;outline:none}
.signup-card input:focus{border:2px solid #5c5686}
.signup-btn{width:100%;padding:14px;background:#4a90e2;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.signup-btn:hover{background:#2f6fb7}
.signup-card p{margin-top:18px;cursor:pointer;color:#555}
.close-btn{float:right;font-size:28px;cursor:pointer}

@media(max-width:900px){
 header{flex-direction:column;padding:20px}
 nav{flex-wrap:wrap;justify-content:center}
 .featured,.collections,.about-section,.contact-container{padding:40px 20px}
 .hero h1{font-size:28px}
}
</style>

let cart = [];

let selectedPay = "", selectedType = "";

const rs = n => "Rs. " + n.toLocaleString("en-US");
function saveCart(){ try{localStorage.setItem("navoCart",JSON.stringify(cart));}catch(e){} updateBadge(); }
function updateBadge(){ document.getElementById("cartCount").textContent = cart.reduce((s,i)=>s+i.qty,0); }

function productAsItem(id){
  const p = PRODUCTS[id];
  return {id, name:p.name, img:p.imgs[0], price:p.price, qty:1};
}
function collectionItem(cid,iid){
  const it = COLLECTIONS[cid].items.find(x=>x.id===iid);
  return {id:it.id, name:it.name, img:it.img, price:it.price, qty:1};
}
function addToCart(item, thenGo){
  const ex = cart.find(c=>c.id===item.id);
  if(ex) ex.qty++; else cart.push(item);
  saveCart();
  if(thenGo) go("cart"); else toast("Added to cart ✓");
}
function buyNow(item){ checkoutItems=[item]; go("checkout"); }

function toast(msg){
  const t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#192bc2;color:white;padding:12px 25px;border-radius:30px;z-index:3000";
  document.body.appendChild(t); setTimeout(()=>t.remove(),1500);
}

/* ================= ROUTER ================= */
function go(route){ location.hash = "#/" + route; }
function goSection(id){
  if(!(location.hash===""||location.hash==="#/home")){ go("home"); setTimeout(()=>scrollToId(id),60); }
  else scrollToId(id);
}
function scrollToId(id){
  const el=document.getElementById(id);
  if(el) el.scrollIntoView({behavior:"smooth"}); else window.scrollTo({top:0,behavior:"smooth"});
}
function doSearch(){
  const q=document.getElementById("searchBox").value.trim();
  if(q) go("search/"+encodeURIComponent(q));
}

function render(){
  const parts=(location.hash.replace(/^#\/?/,"")||"home").split("/");
  const [page,arg]=[parts[0],decodeURIComponent(parts[1]||"")];
  const app=document.getElementById("app");
  clearInterval(window.sliderTimer);
  if(page==="home") app.innerHTML=homePage(), initSlider();
  else if(page==="product" && PRODUCTS[arg]) app.innerHTML=productPage(arg);
  else if(page==="collection" && COLLECTIONS[arg]) app.innerHTML=collectionPage(arg);
  else if(page==="cart") app.innerHTML=cartPage();
  else if(page==="checkout") app.innerHTML=checkoutPage();
  else if(page==="search") app.innerHTML=searchPage(arg);
  else app.innerHTML=homePage(), initSlider();
  if(page!=="home") window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---- CART ---- */
function cartPage(){
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  return `
  <section class="cart-section"><div class="cart-container">
    <div class="cart-items">
      <h2 class="cart-title">Shopping Cart</h2>
      ${cart.length?cart.map((it,i)=>`
        <div class="cart-item">
          <div class="product-info">
            <img src="${it.img}" alt="${it.name}">
            <div><h3>${it.name}</h3><p class="product-price">${rs(it.price)}</p></div>
          </div>
          <div class="quantity">
            <button onclick="changeQty(${i},-1)">-</button><span>${it.qty}</span><button onclick="changeQty(${i},1)">+</button>
          </div>
          <button class="remove-btn" onclick="removeItem(${i})" title="Remove">🗑</button>
        </div>`).join(""):`<p class="empty">Your cart is empty.<br><br><button class="pill" onclick="go('home')">Continue Shopping</button></p>`}
    </div>
    <div class="cart-summary">
      <h2>Order Summary</h2>
      <div class="summary-row"><span>Subtotal</span><span>${rs(sub)}</span></div>
      <div class="summary-row"><span>Shipping</span><span>${cart.length?rs(DELIVERY_FEE):rs(0)}</span></div>
      <hr>
      <div class="summary-row total"><span>Total</span><span>${rs(cart.length?sub+DELIVERY_FEE:0)}</span></div>
      <button class="checkout-btn" onclick="cartCheckout()">Proceed to Checkout</button>
      <a class="whatsapp-btn" target="_blank" href="${waLink(cart)}">Order via WhatsApp</a>
    </div>
  </div></section>`;
}
function changeQty(i,d){ cart[i].qty=Math.max(1,cart[i].qty+d); saveCart(); render(); }
function removeItem(i){ cart.splice(i,1); saveCart(); render(); }
function cartCheckout(){ if(!cart.length){toast("Cart is empty");return;} checkoutItems=null; go("checkout"); }
function waLink(items){
  let msg="Hello Navo Zone, I want to place an order.";
  if(items.length){
    msg+="\n"+items.map(i=>`• ${i.name} x${i.qty} = ${rs(i.price*i.qty)}`).join("\n");
    msg+=`\nTotal (with delivery): ${rs(items.reduce((s,i)=>s+i.price*i.qty,0)+DELIVERY_FEE)}`;
  }
  return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
}

/* ---- CHECKOUT ---- */
function currentItems(){ return checkoutItems || cart; }
function checkoutPage(){

  const sub=items.reduce((s,i)=>s+i.price*i.qty,0);

  return `
  <div class="checkout-container">
    <div class="delivery-info">
      <h2>Delivery Information</h2>
      <div class="form-row">
        <div class="form-group"><label>Full Name</label><input id="f_name" type="text" placeholder="Enter your full name"></div>
        <div class="form-group"><label>Province</label>
          <select id="f_prov"><option value="">Select Province</option>${PROVINCES.map(x=>`<option>${x}</option>`).join("")}</select></div>

      <div class="form-row">
        <div class="form-group"><label>Phone Number</label><input id="f_phone" type="tel" placeholder="Enter phone number"></div>

      <div class="form-row">
        <div class="form-group"><label>City</label><input id="f_city" type="text" placeholder="Enter city"></div>
        <div class="form-group"><label>Address</label><input id="f_addr" type="text" placeholder="House No / Street"></div>
      </div>
      <label>Additional Address Details</label>
      <textarea id="f_more" placeholder="Enter complete delivery address"></textarea>

      <div class="delivery-label">
        <h3 style="margin-top:25px">Select Delivery Type</h3>
        <div class="label-buttons">
          <button class="label-btn" onclick="pickType(this,'Office')">🏢 OFFICE</button>
          <button class="label-btn" onclick="pickType(this,'Home')">🏠 HOME</button>
        </div>
      </div>

      <div class="payment-method">
        <h3>Payment Methods</h3>
        <div class="payment-grid">
          ${PAYMENTS.map(p=>`<div class="payment-card" onclick="pickPay(this,'${p[0]}')"><img src="${p[1]}"><p>${p[0]}</p></div>`).join("")}
        </div>
      </div>
    </div>

    <div class="order-summary">
      <h2>Promotion</h2>
      <div class="promo"><input type="text" placeholder="Enter Promo Code"><button class="apply-btn" onclick="toast('Invalid promo code')">APPLY</button></div>
      <h2>Order Summary</h2>
      ${items.map(i=>`<div class="summary-item"><span>${i.name} × ${i.qty}</span><span>${rs(i.price*i.qty)}</span></div>`).join("")}
      <hr><br>
      <div class="summary-item"><span>Items Total</span><span>${rs(sub)}</span></div>
      <div class="summary-item"><span>Delivery Fee</span><span>${rs(DELIVERY_FEE)}</span></div>
      <hr><br>
      <div class="summary-item total"><span>Total</span><span>${rs(sub+DELIVERY_FEE)}</span></div>
      <button class="pay-btn" onclick="placeOrder()">Proceed to Pay</button>
      <div class="err" id="err"></div>
    </div>
  </div>`;
}
function pickType(el,v){ selectedType=v; document.querySelectorAll(".label-btn").forEach(b=>b.classList.remove("sel")); el.classList.add("sel"); }
function pickPay(el,v){ selectedPay=v; document.querySelectorAll(".payment-card").forEach(b=>b.classList.remove("sel")); el.classList.add("sel"); }
function placeOrder(){
  const items=currentItems();
  const g=id=>document.getElementById(id).value.trim();
  const err=document.getElementById("err");
  if(!items.length){ err.textContent="Your cart is empty."; return; }
  if(!g("f_name")||!g("f_phone")||!g("f_prov")||!g("f_dist")||!g("f_city")||!g("f_addr")){ err.textContent="Please fill in all delivery details."; return; }
  if(!/^[0-9+\s-]{9,15}$/.test(g("f_phone"))){ err.textContent="Please enter a valid phone number."; return; }
  if(!selectedPay){ err.textContent="Please select a payment method."; return; }
  const sub=items.reduce((s,i)=>s+i.price*i.qty,0);
  let msg=`Hello Navo Zone, new order!\n`+items.map(i=>`• ${i.name} x${i.qty} = ${rs(i.price*i.qty)}`).join("\n");
  msg+=`\nTotal: ${rs(sub+DELIVERY_FEE)} (incl. delivery ${rs(DELIVERY_FEE)})\nPayment: ${selectedPay}\n`;
  msg+=`Name: ${g("f_name")}\nPhone: ${g("f_phone")}\nAddress: ${g("f_addr")}, ${g("f_city")}, ${g("f_dist")}, ${g("f_prov")} ${selectedType?"("+selectedType+")":""}\n${g("f_more")}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
  if(!checkoutItems){ cart=[]; saveCart(); }
  checkoutItems=null;
  document.getElementById("app").innerHTML=`<section class="featured"><h2>🎉 Thank you for your order!</h2><p style="margin-bottom:25px">We will contact you shortly to confirm your order.</p><button class="pill" onclick="go('home')">Back to Home</button></section>`;
  window.scrollTo(0,0);
}

/* ---- SLIDER ---- */
let slideIndex=0;
function changeSlide(d){
  slideIndex=(slideIndex+d+3)%3;
  const c=document.getElementById("slideContainer");
  if(c) c.style.transform="translateX("+(-slideIndex*33.3333)+"%)";
}
function initSlider(){ slideIndex=0; window.sliderTimer=setInterval(()=>changeSlide(1),4000); }

/* ---- SIGNUP ---- */
function openSignup(){ document.getElementById("signupBox").style.display="flex"; }
function closeSignup(){ document.getElementById("signupBox").style.display="none"; }

/* ---- START ---- */
updateBadge();
render();
</script>
